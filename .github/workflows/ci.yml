name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/community_coin
          NEXT_PUBLIC_SITE_URL: https://example.com
